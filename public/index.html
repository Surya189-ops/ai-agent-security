<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Agent Security Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #94a3b8;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #14532d;
      color: #bbf7d0;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* Statistics */

    .stats {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(200px, 1fr)
      );
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
    }

    .stat-label {
      color: #94a3b8;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      margin-top: 10px;
      font-size: 30px;
      font-weight: bold;
    }

    .stat-description {
      margin-top: 5px;
      color: #64748b;
      font-size: 12px;
    }

    /* Kill switch */

    .kill-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #1e293b;
    }

    .kill-switch-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .kill-switch-icon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 22px;
    }

    .kill-switch-icon.safe {
      background: #14532d;
    }

    .kill-switch-icon.danger {
      background: #450a0a;
    }

    .kill-switch-title {
      font-size: 16px;
      font-weight: bold;
    }

    .kill-switch-description {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 12px;
    }

    .kill-switch-badge {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .kill-switch-badge.safe {
      background: #14532d;
      color: #86efac;
    }

    .kill-switch-badge.danger {
      background: #450a0a;
      color: #fca5a5;
    }

    .kill-switch-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .kill-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    .kill-btn-on {
      background: #b91c1c;
      color: white;
    }

    .kill-btn-on:hover {
      background: #dc2626;
    }

    .kill-btn-off {
      background: #15803d;
      color: white;
    }

    .kill-btn-off:hover {
      background: #16a34a;
    }

    .kill-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }


    /* Create agent */

    .create-agent-card {
      margin-bottom: 30px;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #1e293b;
    }

    .create-agent-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #475569;
      border-radius: 8px;
      outline: none;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }

    .form-input:focus {
      border-color: #6366f1;
    }

    .create-agent-button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      background: #3730a3;
      color: #e0e7ff;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .create-agent-button:hover {
      background: #4338ca;
    }

    .create-agent-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .create-agent-message {
      margin-top: 14px;
      min-height: 18px;
      color: #94a3b8;
      font-size: 12px;
    }

    .create-agent-message.error {
      margin: 14px 0 0;
      padding: 10px 12px;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fecaca;
    }

    .api-key-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 9px;
      background: #172033;
      border: 1px solid #334155;
    }

    .api-key-warning {
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .api-key-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .api-key-value {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border-radius: 7px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 12px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .copy-key-button {
      border: none;
      border-radius: 7px;
      padding: 9px 11px;
      background: #334155;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .copy-key-button:hover {
      background: #475569;
    }

    /* Sections */

    .section-heading {
      margin: 35px 0 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 20px;
    }

    .section-heading p {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    /* Agent cards */

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(300px, 1fr)
      );
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px;
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .agent-name {
      font-size: 20px;
      font-weight: bold;
    }

    .agent-id {
      color: #64748b;
      font-size: 12px;
      margin-top: 4px;
    }

    .limit {
      padding: 6px 10px;
      border-radius: 7px;
      background: #312e81;
      color: #c7d2fe;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Daily spending */

    .spending-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .spending-info > div {
      padding: 12px;
      border-radius: 8px;
      background: #172033;
      border: 1px solid #334155;
    }

    .spending-label {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .spending-info strong {
      font-size: 15px;
    }

    .spending-unlimited {
      margin-bottom: 20px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #172033;
      color: #94a3b8;
      font-size: 12px;
    }

    .section-title {
      margin: 20px 0 10px;
      color: #94a3b8;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .permission {
      padding: 14px 0;
      border-bottom: 1px solid #334155;
    }

    .permission:last-child {
      border-bottom: none;
    }

    .permission-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .permission-name {
      font-family: monospace;
      font-size: 14px;
    }

    .permission-details {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .permission-status {
      text-align: right;
    }

    .allowed {
      color: #4ade80;
      font-size: 13px;
      font-weight: bold;
    }

    .blocked {
      color: #f87171;
      font-size: 13px;
      font-weight: bold;
    }

    .max-amount {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 3px;
    }

    .permission-button {
      border: none;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .permission-button.block-button {
      background: #7f1d1d;
      color: #fecaca;
    }

    .permission-button.allow-button {
      background: #166534;
      color: #bbf7d0;
    }

    .permission-button:hover {
      opacity: 0.85;
    }

    .permission-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* Limit editor */

    .limit-editor {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .limit-label {
      color: #94a3b8;
      font-size: 11px;
      white-space: nowrap;
    }

    .limit-input {
      width: 110px;
      padding: 7px 9px;
      border: 1px solid #475569;
      border-radius: 7px;
      outline: none;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
    }

    .limit-input:focus {
      border-color: #6366f1;
    }

    .limit-save-button {
      border: none;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      background: #3730a3;
      color: #e0e7ff;
      font-size: 11px;
      font-weight: bold;
    }

    .limit-save-button:hover {
      opacity: 0.85;
    }

    .limit-save-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .save-message {
      margin-top: 10px;
      min-height: 17px;
      color: #4ade80;
      font-size: 12px;
    }

    .save-error {
      color: #f87171;
    }

    /* Audit logs */

    .logs-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
    }

    .logs-table-wrapper {
      overflow-x: auto;
    }

    .logs-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    .logs-table th {
      text-align: left;
      padding: 14px 16px;
      background: #172033;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .logs-table td {
      padding: 15px 16px;
      border-top: 1px solid #334155;
      font-size: 13px;
      vertical-align: top;
    }

    .logs-table tr:hover {
      background: #243146;
    }

    .log-agent {
      font-family: monospace;
      color: #cbd5e1;
    }

    .log-action {
      font-family: monospace;
      color: #e2e8f0;
    }

    .log-amount {
      white-space: nowrap;
    }

    .log-status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .log-status.allowed {
      background: #14532d;
      color: #86efac;
    }

    .log-status.blocked {
      background: #450a0a;
      color: #fca5a5;
    }

    .log-reason {
      color: #94a3b8;
      max-width: 300px;
      line-height: 1.4;
    }

    .log-time {
      color: #94a3b8;
      white-space: nowrap;
      font-size: 12px;
    }

    .no-logs {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }

    /* Loading / errors */

    .loading {
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    .error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fecaca;
      padding: 20px;
      border-radius: 10px;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    @media (max-width: 600px) {

      .container {
        padding: 20px 14px;
      }

      .header h1 {
        font-size: 24px;
      }

      .agent-header {
        align-items: flex-start;
      }

      .kill-switch {
        align-items: flex-start;
      }

      .kill-switch-controls {
        width: 100%;
        justify-content: flex-start;
      }

      .permission-top {
        align-items: flex-start;
      }

      .permission-details {
        flex-direction: column;
        align-items: flex-end;
      }

      .limit-editor {
        flex-wrap: wrap;
      }

      .spending-info {
        grid-template-columns: 1fr;
      }

      .create-agent-form {
        grid-template-columns: 1fr;
      }

      .create-agent-button {
        width: 100%;
      }

      .api-key-row {
        align-items: stretch;
        flex-direction: column;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>🛡️ AI Agent Security</h1>

      <p>
        Monitor and manage AI agent permissions,
        spending limits and security policies.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Security API Connected
      </div>

    </div>

    <div id="dashboard">

      <div class="loading">
        Loading security dashboard...
      </div>

    </div>

  </div>

  <script>

    let securityApiKey = null;

    async function loadDashboard() {

      const dashboard =
        document.getElementById("dashboard");

      try {

        securityApiKey = prompt(
          "Enter your Security API key:"
        );

        if (!securityApiKey) {

          dashboard.innerHTML = `
            <div class="error">
              Security API key is required.
            </div>
          `;

          return;
        }

        await refreshDashboard();

      } catch (error) {

        console.error(error);

        dashboard.innerHTML = `
          <div class="error">
            <strong>
              Failed to load dashboard
            </strong>
            <br />
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }

    async function refreshDashboard() {

      const statsResponse =
        await fetch(
          "/dashboard/stats",
          {
            headers: {
              "x-api-key": securityApiKey
            }
          }
        );

      const agentsResponse =
        await fetch(
          "/dashboard/agents",
          {
            headers: {
              "x-api-key": securityApiKey
            }
          }
        );

      const eventsResponse =
        await fetch(
          "/dashboard/events",
          {
            headers: {
              "x-api-key": securityApiKey
            }
          }
        );

      const killSwitchResponse =
        await fetch(
          "/kill-switch",
          {
            headers: {
              "x-api-key": securityApiKey
            }
          }
        );

      if (
        !statsResponse.ok ||
        !agentsResponse.ok ||
        !eventsResponse.ok ||
        !killSwitchResponse.ok
      ) {

        throw new Error(
          "Failed to load dashboard data"
        );

      }

      const stats =
        await statsResponse.json();

      const data =
        await agentsResponse.json();

      const eventsData =
        await eventsResponse.json();

      const killSwitchData =
        await killSwitchResponse.json();

      const logs =
        Array.isArray(eventsData.events)
          ? eventsData.events.slice(0, 10)
          : [];

      const killSwitchEnabled =
        Boolean(
          killSwitchData.killSwitch
        );

      document.getElementById(
        "dashboard"
      ).innerHTML =
        buildDashboardHtml(
          stats,
          data,
          logs,
          killSwitchEnabled
        );

    }

    function buildDashboardHtml(
      stats,
      data,
      logs,
      killSwitchEnabled
    ) {

      return `

        <!-- Statistics -->

        <div class="stats">

          <div class="stat-card">

            <div class="stat-label">
              Total Agents
            </div>

            <div class="stat-value">
              ${stats.totalAgents}
            </div>

            <div class="stat-description">
              Registered AI agents
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-label">
              Requests Today
            </div>

            <div class="stat-value">
              ${stats.requestsToday}
            </div>

            <div class="stat-description">
              Security decisions
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-label">
              Allowed Today
            </div>

            <div class="stat-value">
              ${stats.allowedToday}
            </div>

            <div class="stat-description">
              Approved actions
            </div>

          </div>

          <div class="stat-card">

            <div class="stat-label">
              Blocked Today
            </div>

            <div class="stat-value">
              ${stats.blockedToday}
            </div>

            <div class="stat-description">
              Prevented actions
            </div>

          </div>

        </div>

        <!-- Kill Switch -->

        <div class="kill-switch">

          <div class="kill-switch-left">

            <div class="
              kill-switch-icon
              ${killSwitchEnabled ? "danger" : "safe"}
            ">

              ${killSwitchEnabled ? "🚨" : "🛡️"}

            </div>

            <div>

              <div class="kill-switch-title">

                ${killSwitchEnabled
                  ? "Emergency Stop Active"
                  : "Security System Active"
                }

              </div>

              <div class="kill-switch-description">

                ${killSwitchEnabled
                  ? "All protected agent actions are currently blocked."
                  : "AI agent actions are being evaluated by security policies."
                }

              </div>

            </div>

          </div>

          <div class="kill-switch-controls">

            <div class="
              kill-switch-badge
              ${killSwitchEnabled ? "danger" : "safe"}
            ">

              ${killSwitchEnabled
                ? "KILL SWITCH: ON"
                : "KILL SWITCH: OFF"
              }

            </div>

            ${
              killSwitchEnabled
                ? `
                  <button
                    class="kill-btn kill-btn-off"
                    onclick="setKillSwitch(false)"
                  >
                    Turn OFF
                  </button>
                `
                : `
                  <button
                    class="kill-btn kill-btn-on"
                    onclick="setKillSwitch(true)"
                  >
                    🚨 Emergency Stop
                  </button>
                `
            }

          </div>

        </div>

        <!-- Create Agent -->

        <div class="section-heading">

          <h2>
            Register New Agent
          </h2>

          <p>
            Create an agent with a private API key and secure default permissions.
          </p>

        </div>

        <div class="create-agent-card">

          <form
            class="create-agent-form"
            onsubmit="createAgent(event)"
          >

            <div class="form-field">

              <label for="create-agent-id">
                Agent ID
              </label>

              <input
                id="create-agent-id"
                class="form-input"
                type="text"
                placeholder="payment-bot"
                autocomplete="off"
                required
              />

            </div>

            <div class="form-field">

              <label for="create-agent-name">
                Agent Name
              </label>

              <input
                id="create-agent-name"
                class="form-input"
                type="text"
                placeholder="Payment Bot"
                autocomplete="off"
                required
              />

            </div>

            <div class="form-field">

              <label for="create-agent-limit">
                Daily Limit (₹)
              </label>

              <input
                id="create-agent-limit"
                class="form-input"
                type="number"
                min="0"
                step="1"
                placeholder="100000"
              />

            </div>

            <button
              id="create-agent-button"
              class="create-agent-button"
              type="submit"
            >
              ➕ Create Agent
            </button>

          </form>

          <div
            id="create-agent-message"
            class="create-agent-message"
          ></div>

        </div>

        <!-- Agents -->

        <div class="section-heading">

          <h2>
            AI Agents
          </h2>

          <p>
            Agent permissions and spending policies
          </p>

        </div>

        ${!data.agents ||
          data.agents.length === 0

          ? `
              <div class="empty">
                No agents found.
              </div>
            `

          : `
              <div class="grid">

                ${data.agents
                  .map(renderAgent)
                  .join("")}

              </div>
            `
        }

        <!-- Recent Security Events -->

        <div class="section-heading">

          <h2>
            Recent Security Events
          </h2>

          <p>
            Latest permission decisions made by the security service
          </p>

        </div>

        <div class="logs-container">

          ${logs.length === 0

          ? `
                <div class="no-logs">
                  No security events found.
                </div>
              `

          : `
                <div class="logs-table-wrapper">

                  <table class="logs-table">

                    <thead>

                      <tr>

                        <th>Time</th>
                        <th>Agent</th>
                        <th>Action</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Reason</th>

                      </tr>

                    </thead>

                    <tbody>

                      ${logs
                        .map(renderLog)
                        .join("")}

                    </tbody>

                  </table>

                </div>
              `
        }

        </div>

      `;

    }

    function renderAgent(agent) {

      const hasDailyLimit =
        agent.dailyLimit !== null &&
        agent.dailyLimit !== undefined;

      const dailyLimit =
        hasDailyLimit
          ? `₹${Number(
              agent.dailyLimit
            ).toLocaleString()} / day`
          : "Unlimited";

      const spendingInfo =
        hasDailyLimit
          ? `
            <div class="spending-info">

              <div>

                <span class="spending-label">
                  Spent Today
                </span>

                <strong>
                  ₹${Number(
                    agent.spentToday ?? 0
                  ).toLocaleString()}
                </strong>

              </div>

              <div>

                <span class="spending-label">
                  Remaining Today
                </span>

                <strong>
                  ₹${Number(
                    agent.remainingToday ?? 0
                  ).toLocaleString()}
                </strong>

              </div>

            </div>
          `
          : `
            <div class="spending-unlimited">
              No daily spending limit
            </div>
          `;

      const permissions =
        agent.permissions
          .map(permission => {

            const status =
              permission.allowed
                ? "ALLOWED"
                : "BLOCKED";

            const statusClass =
              permission.allowed
                ? "allowed"
                : "blocked";

            const buttonText =
              permission.allowed
                ? "Block"
                : "Allow";

            const buttonClass =
              permission.allowed
                ? "block-button"
                : "allow-button";

            const isMonetaryAction =
              permission.action === "refund";

            const maxAmountExists =
              isMonetaryAction &&
              permission.maxAmount !== null &&
              permission.maxAmount !== undefined;

            const maxAmount =
              maxAmountExists
                ? Number(permission.maxAmount)
                : null;

            return `

              <div class="permission">

                <div class="permission-top">

                  <div class="permission-name">

                    ${escapeHtml(
                      permission.action
                    )}

                  </div>

                  <div class="permission-details">

                    <div class="permission-status">

                      <div class="${statusClass}">
                        ${status}
                      </div>

                      ${maxAmountExists
                        ? `
                            <div class="max-amount">
                              Max:
                              ₹${maxAmount.toLocaleString()}
                            </div>
                          `
                        : ""
                      }

                    </div>

                    <button
                      class="
                        permission-button
                        ${buttonClass}
                      "
                      onclick="togglePermission(
                        '${escapeJs(agent.id)}',
                        '${escapeJs(permission.action)}',
                        ${!permission.allowed},
                        ${maxAmountExists
                          ? maxAmount
                          : "null"}
                      )"
                    >
                      ${buttonText}
                    </button>

                  </div>

                </div>

                ${maxAmountExists
                  ? `
                      <div class="limit-editor">

                        <span class="limit-label">
                          Max amount:
                        </span>

                        <input
                          id="${getLimitInputId(
                            agent.id,
                            permission.action
                          )}"
                          class="limit-input"
                          type="number"
                          min="0"
                          step="1"
                          value="${maxAmount}"
                        />

                        <button
                          class="limit-save-button"
                          onclick="updateLimit(
                            '${escapeJs(agent.id)}',
                            '${escapeJs(permission.action)}'
                          )"
                        >
                          Save Limit
                        </button>

                      </div>
                    `
                  : ""
                }

              </div>

            `;

          })
          .join("");

      return `

        <div class="card">

          <div class="agent-header">

            <div>

              <div class="agent-name">
                🤖 ${escapeHtml(agent.name)}
              </div>

              <div class="agent-id">
                ${escapeHtml(agent.id)}
              </div>

            </div>

            <div class="limit">
              ${dailyLimit}
            </div>

          </div>

          ${spendingInfo}

          <div class="section-title">
            Permissions
          </div>

          <div>
            ${permissions}
          </div>

          <div
            id="message-${escapeHtml(agent.id)}"
            class="save-message"
          ></div>

        </div>

      `;

    }

    async function createAgent(event) {

      event.preventDefault();

      const idInput =
        document.getElementById(
          "create-agent-id"
        );

      const nameInput =
        document.getElementById(
          "create-agent-name"
        );

      const limitInput =
        document.getElementById(
          "create-agent-limit"
        );

      const button =
        document.getElementById(
          "create-agent-button"
        );

      const message =
        document.getElementById(
          "create-agent-message"
        );

      const id =
        idInput.value.trim();

      const name =
        nameInput.value.trim();

      const dailyLimitValue =
        limitInput.value.trim();

      if (!id || !name) {
        message.className =
          "create-agent-message error";
        message.textContent =
          "Agent ID and Agent Name are required.";
        return;
      }

      if (
        dailyLimitValue !== "" &&
        (!Number.isFinite(
          Number(dailyLimitValue)
        ) ||
          Number(dailyLimitValue) < 0)
      ) {
        message.className =
          "create-agent-message error";
        message.textContent =
          "Daily limit must be a valid non-negative number.";
        return;
      }

      const body = {
        id,
        name
      };

      if (dailyLimitValue !== "") {
        body.dailyLimit =
          Number(dailyLimitValue);
      }

      button.disabled = true;
      button.textContent =
        "Creating...";

      message.className =
        "create-agent-message";
      message.textContent =
        "Creating secure agent...";

      try {

        const response =
          await fetch(
            "/agents",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "x-api-key":
                  securityApiKey
              },

              body: JSON.stringify(body)
            }
          );

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            `HTTP ${response.status}`
          );
        }

        message.className =
          "create-agent-message";

        message.innerHTML = `
          <strong>
            Agent created successfully.
          </strong>

          <div class="api-key-box">

            <div class="api-key-warning">
              ⚠️ Save this API key now. It is the agent's private credential.
            </div>

            <div class="api-key-row">

              <div
                id="created-agent-api-key"
                class="api-key-value"
              >
                ${escapeHtml(
                  result.agent.apiKey
                )}
              </div>

              <button
                type="button"
                class="copy-key-button"
                onclick="copyCreatedAgentKey()"
              >
                Copy Key
              </button>

            </div>

          </div>
        `;

        idInput.value = "";
        nameInput.value = "";
        limitInput.value = "";

        await refreshDashboard();

        // refreshDashboard rebuilds the page, so show the new
        // API key again after the refresh.
        const refreshedMessage =
          document.getElementById(
            "create-agent-message"
          );

        if (refreshedMessage) {
          refreshedMessage.className =
            "create-agent-message";

          refreshedMessage.innerHTML = `
            <strong>
              Agent created successfully.
            </strong>

            <div class="api-key-box">

              <div class="api-key-warning">
                ⚠️ Save this API key now. It is the agent's private credential.
              </div>

              <div class="api-key-row">

                <div
                  id="created-agent-api-key"
                  class="api-key-value"
                >
                  ${escapeHtml(
                    result.agent.apiKey
                  )}
                </div>

                <button
                  type="button"
                  class="copy-key-button"
                  onclick="copyCreatedAgentKey()"
                >
                  Copy Key
                </button>

              </div>

            </div>
          `;
        }

      } catch (error) {

        console.error(error);

        message.className =
          "create-agent-message error";

        message.textContent =
          `Failed to create agent: ${error.message}`;

      } finally {

        button.disabled = false;
        button.textContent =
          "➕ Create Agent";

      }

    }

    async function copyCreatedAgentKey() {

      const element =
        document.getElementById(
          "created-agent-api-key"
        );

      if (!element) {
        return;
      }

      try {

        await navigator.clipboard.writeText(
          element.textContent.trim()
        );

        const button =
          document.querySelector(
            ".copy-key-button"
          );

        if (button) {
          const originalText =
            button.textContent;

          button.textContent =
            "Copied ✓";

          setTimeout(() => {
            button.textContent =
              originalText;
          }, 1500);
        }

      } catch (error) {

        alert(
          "Could not copy the API key. Please copy it manually."
        );

      }

    }

    async function setKillSwitch(enabled) {

      const confirmed = confirm(
        enabled
          ? "Enable the emergency kill switch? All protected agent actions will be blocked."
          : "Disable the emergency kill switch?"
      );

      if (!confirmed) {
        return;
      }

      try {

        const endpoint = enabled
          ? "/kill-switch/on"
          : "/kill-switch/off";

        const response =
          await fetch(
            endpoint,
            {
              method: "POST",
              headers: {
                "x-api-key":
                  securityApiKey
              }
            }
          );

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            `HTTP ${response.status}`
          );
        }

        await refreshDashboard();

      } catch (error) {

        console.error(error);

        alert(
          `Failed to update kill switch: ${error.message}`
        );

      }

    }

    async function togglePermission(
      agentId,
      action,
      allowed,
      maxAmount
    ) {

      showAgentMessage(
        agentId,
        "Updating permission...",
        false
      );

      try {

        const response =
          await fetch(
            `/agents/${encodeURIComponent(agentId)}/permissions`,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json",

                "x-api-key":
                  securityApiKey
              },

              body: JSON.stringify({
                action,
                allowed,
                maxAmount
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok) {

          throw new Error(
            result.error ||
            `HTTP ${response.status}`
          );

        }

        await refreshDashboard();

      } catch (error) {

        console.error(error);

        showAgentMessage(
          agentId,
          `Failed: ${error.message}`,
          true
        );

      }

    }

    async function updateLimit(
      agentId,
      action
    ) {

      const inputId =
        getLimitInputId(
          agentId,
          action
        );

      const input =
        document.getElementById(inputId);

      if (!input) {
        return;
      }

      const value =
        Number(input.value);

      if (
        !Number.isFinite(value) ||
        value < 0
      ) {

        showAgentMessage(
          agentId,
          "Enter a valid non-negative amount.",
          true
        );

        return;
      }

      showAgentMessage(
        agentId,
        "Updating limit...",
        false
      );

      try {

        /*
         * First fetch the current permission
         * so we preserve its allowed state.
         */

        const permissionsResponse =
          await fetch(
            `/agents/${encodeURIComponent(agentId)}/permissions`,
            {
              headers: {
                "x-api-key":
                  securityApiKey
              }
            }
          );

        if (!permissionsResponse.ok) {

          throw new Error(
            `Failed to load current permission`
          );

        }

        const agent =
          await permissionsResponse.json();

        const permission =
          agent.permissions.find(
            item =>
              item.action === action
          );

        if (!permission) {

          throw new Error(
            "Permission not found"
          );

        }

        /*
         * Update only the maximum amount.
         */

        const response =
          await fetch(
            `/agents/${encodeURIComponent(agentId)}/permissions`,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json",

                "x-api-key":
                  securityApiKey
              },

              body: JSON.stringify({
                action,
                allowed:
                  permission.allowed,
                maxAmount: value
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok) {

          throw new Error(
            result.error ||
            `HTTP ${response.status}`
          );

        }

        await refreshDashboard();

      } catch (error) {

        console.error(error);

        showAgentMessage(
          agentId,
          `Failed: ${error.message}`,
          true
        );

      }

    }

    function getLimitInputId(
      agentId,
      action
    ) {

      return (
        "limit-" +
        encodeURIComponent(agentId) +
        "-" +
        encodeURIComponent(action)
      );

    }

    function showAgentMessage(
      agentId,
      message,
      isError
    ) {

      const element =
        document.getElementById(
          `message-${agentId}`
        );

      if (!element) {
        return;
      }

      element.className =
        isError
          ? "save-message save-error"
          : "save-message";

      element.textContent =
        message;

    }

    function renderLog(log) {

      const status =
        log.allowed
          ? "ALLOWED"
          : "BLOCKED";

      const statusClass =
        log.allowed
          ? "allowed"
          : "blocked";

      const amount =
        log.amount !== null &&
          log.amount !== undefined
          ? `₹${Number(
              log.amount
            ).toLocaleString()}`
          : "—";

      return `

        <tr>

          <td class="log-time">
            ${formatDate(
              log.createdAt
            )}
          </td>

          <td class="log-agent">
            ${escapeHtml(
              log.agentId
            )}
          </td>

          <td class="log-action">
            ${escapeHtml(
              log.action
            )}
          </td>

          <td class="log-amount">
            ${amount}
          </td>

          <td>

            <span
              class="log-status ${statusClass}"
            >
              ${status}
            </span>

          </td>

          <td class="log-reason">
            ${escapeHtml(
              log.reason
            )}
          </td>

        </tr>

      `;

    }

    function formatDate(value) {

      if (!value) {
        return "—";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "—";
      }

      return date.toLocaleString(
        undefined,
        {
          day: "2-digit",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );

    }

    function escapeHtml(value) {

      return String(value)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }

    function escapeJs(value) {

      return String(value)
        .replaceAll(
          "\\",
          "\\\\"
        )
        .replaceAll(
          "'",
          "\\'"
        );

    }

    loadDashboard();

  </script>
